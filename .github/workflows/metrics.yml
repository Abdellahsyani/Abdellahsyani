name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Abdellahsyani
          debug: true
          template: classic      # Or use "terminal" for the matrix look
          base: header, metadata
          
          config_timezone: Africa/Casablanca
          
          plugin_repositories: yes
          plugin_repositories_featured: Abdellahsyani/webserv, Abdellahsyani/minishell
          
          config_order: base.header, base.metadata
